name: Bug
description: Something does not work as expected
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Environment and agency
      placeholder: staging · Genie Magnet · Chrome on Android
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options: ["Blocker — data leak or data loss", "High — a workflow is stuck", "Medium", "Low"]
    validations:
      required: true
