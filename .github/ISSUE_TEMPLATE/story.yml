name: User story
description: A piece of work from the backlog, with acceptance criteria
labels: ["story"]
body:
  - type: input
    id: module
    attributes:
      label: Module
      placeholder: e.g. Onboarding, Content, Billing
    validations:
      required: true
  - type: textarea
    id: story
    attributes:
      label: Story
      value: "As a <role>, I want <capability>, so that <outcome>."
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Given / when / then, one per line
    validations:
      required: true
  - type: dropdown
    id: phase
    attributes:
      label: Phase
      options: ["Phase 1", "Phase 2", "Phase 3", "Phase 4", "Phase 5", "Phase 6", "Phase 7"]
    validations:
      required: true
