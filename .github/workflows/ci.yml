name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web app (lint, types, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The web app uses @gm/shared's built output (types, permission rules).
      - run: npm run build -w @gm/shared
      - run: npm run lint
      - run: npx tsc --noEmit -p apps/web
      - run: npm run build

  services:
    name: API, background jobs and cross-tenant suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: genie_owner
          POSTGRES_PASSWORD: owner-ci
          POSTGRES_DB: genie_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U genie_owner -d genie_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_OWNER_URL: postgresql://genie_owner:owner-ci@localhost:5432/genie_test
      TEST_DATABASE_APP_URL: postgresql://genie_app:app-ci@localhost:5432/genie_test
      TEST_DATABASE_AUTH_URL: postgresql://genie_auth:auth-ci@localhost:5432/genie_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Create the runtime and auth roles (no RLS bypass) and a shadow database
        run: |
          psql "$TEST_DATABASE_OWNER_URL" -c "CREATE ROLE genie_app LOGIN PASSWORD 'app-ci' NOSUPERUSER NOBYPASSRLS"
          psql "$TEST_DATABASE_OWNER_URL" -c "CREATE ROLE genie_auth LOGIN PASSWORD 'auth-ci' NOSUPERUSER NOBYPASSRLS"
          psql "$TEST_DATABASE_OWNER_URL" -c "CREATE DATABASE genie_shadow"
      - run: npm run format:check
      - run: npm run build:services
      - name: Schema is valid and migrations match it
        working-directory: packages/db
        run: |
          npx prisma validate
          npx prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema.prisma --exit-code
        env:
          DATABASE_OWNER_URL: ${{ env.TEST_DATABASE_OWNER_URL }}
          SHADOW_DATABASE_URL: postgresql://genie_owner:owner-ci@localhost:5432/genie_shadow
      - name: Unit tests
        run: npm test -w @gm/shared
      - name: Cross-tenant suite (database and API) — a failure blocks the merge
        run: npm test -w @gm/db -w api
