# Local development stack. Dev-only credentials — never reuse them anywhere else.
#   npm run infra:up      start everything
#   npm run infra:down    stop (data is kept in volumes)
name: genie-magnet

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: genie_owner
      POSTGRES_PASSWORD: genie_owner_dev
      POSTGRES_DB: genie
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genie_owner -d genie"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: genie
      MINIO_ROOT_PASSWORD: genie-secret-dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # inbox UI → http://localhost:8025

volumes:
  pgdata:
  miniodata:
